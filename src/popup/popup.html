<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CheckView</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="../assets/logo-small.svg" alt="">
      <div>
        <h1>CheckView</h1>
        <span class="subtitle" data-i18n="subtitle"></span>
      </div>
    </div>
    <select id="language" class="language" aria-label="Language">
      <option value="en">EN</option>
      <option value="es">ES</option>
    </select>
  </header>

  <form id="user-form" class="user-form">
    <input id="username" type="text" data-i18n-placeholder="usernamePlaceholder" autocomplete="off">
    <button type="submit" data-i18n="load"></button>
  </form>

  <p id="status" class="status" hidden></p>

  <ul id="game-list" class="game-list"></ul>

  <template id="game-row">
    <li class="game">
      <span class="game-result"></span>
      <div class="game-info">
        <span class="game-opponent"></span>
        <span class="game-meta"></span>
      </div>
      <button class="game-analyze" data-i18n="analyze"></button>
    </li>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
